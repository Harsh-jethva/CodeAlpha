<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secure Coding Review{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-alt: #111827;
      --panel: rgba(15, 23, 42, 0.82);
      --panel-border: rgba(148, 163, 184, 0.2);
      --text: #e5eefb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #34d399;
      --danger: #fb7185;
      --warning: #f59e0b;
      --shadow: 0 24px 60px rgba(2, 6, 23, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.26), transparent 30%),
        radial-gradient(circle at top right, rgba(52, 211, 153, 0.18), transparent 24%),
        linear-gradient(135deg, #020617 0%, #0f172a 55%, #111827 100%);
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand {
      font-size: 0.95rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 16px;
      font-weight: 600;
      opacity: 0.86;
    }

    .nav a:hover { color: var(--accent); }

    .hero {
      padding: 44px;
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.72));
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 24px;
      align-items: center;
    }

    .hero-copy { grid-column: span 7; }
    .hero-panel { grid-column: span 5; }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      font-size: clamp(2.3rem, 4vw, 4.7rem);
      line-height: 0.98;
      margin-bottom: 18px;
      letter-spacing: -0.05em;
    }

    p {
      color: var(--muted);
      line-height: 1.65;
      font-size: 1rem;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 22px 0 28px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: #dbeafe;
      font-size: 0.92rem;
    }

    .pill.bad { color: #fecaca; }
    .pill.good { color: #bbf7d0; }

    .cards {
      margin-top: 26px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      background: rgba(15, 23, 42, 0.72);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 1.35rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      margin-top: 14px;
      margin-right: 10px;
      border: 1px solid transparent;
    }

    .cta.primary { background: linear-gradient(135deg, var(--accent), #2563eb); color: white; }
    .cta.secondary { background: rgba(148, 163, 184, 0.1); border-color: rgba(148, 163, 184, 0.22); color: var(--text); }

    .login-shell {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      align-items: stretch;
    }

    .panel {
      border-radius: 24px;
      border: 1px solid var(--panel-border);
      background: rgba(15, 23, 42, 0.82);
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .mode-tag {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .mode-tag.vulnerable { background: rgba(251, 113, 133, 0.16); color: #fecdd3; }
    .mode-tag.secure { background: rgba(52, 211, 153, 0.16); color: #bbf7d0; }

    label {
      display: block;
      font-weight: 700;
      margin: 16px 0 8px;
      color: #dbeafe;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(2, 6, 23, 0.72);
      color: var(--text);
      outline: none;
      font-size: 1rem;
    }

    input:focus {
      border-color: rgba(56, 189, 248, 0.75);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.3);
    }

    .message {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(148, 163, 184, 0.08);
    }

    .message.success {
      border-color: rgba(52, 211, 153, 0.35);
      background: rgba(16, 185, 129, 0.12);
      color: #bbf7d0;
    }

    .message.error {
      border-color: rgba(251, 113, 133, 0.35);
      background: rgba(244, 63, 94, 0.12);
      color: #fecdd3;
    }

    .list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.8;
    }

    .footer-note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    @media (max-width: 900px) {
      .hero-grid, .login-shell, .cards { grid-template-columns: 1fr; }
      .hero-copy, .hero-panel { grid-column: auto; }
      .hero { padding: 24px; }
      .panel { padding: 22px; }
      .topbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">Secure Coding Review Project</div>
      <div class="nav">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('vulnerable_page') }}">Vulnerable</a>
        <a href="{{ url_for('secure_page') }}">Secure</a>
      </div>
    </div>

    {% block content %}{% endblock %}
  </div>
</body>
</html>
