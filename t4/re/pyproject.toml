[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nids-starter"
version = "0.1.0"
description = "Suricata-based network intrusion detection starter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.36",
  "plotly>=5.22",
  "pandas>=2.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
