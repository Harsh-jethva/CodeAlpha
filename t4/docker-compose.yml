version: '3.8'

services:
  # Suricata IDS Engine
  suricata:
    image: jasonish/suricata:latest
    container_name: ids-suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    volumes:
      - ./config/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./rules/custom-rules.rules:/var/lib/suricata/rules/custom-rules.rules:ro
      - ./rules/default-rules.rules:/var/lib/suricata/rules/default-rules.rules:ro
      - ./logs/suricata:/var/log/suricata
    environment:
      - SURICATA_OPTIONS=-i eth0
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Alert Monitor Service
  alert-monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: ids-monitor
    volumes:
      - ./logs/suricata:/var/log/suricata:ro
      - ./logs/monitor:/app/logs
      - ./data:/app/data
    environment:
      - LOG_FILE=/var/log/suricata/eve.json
      - ALERT_INTERVAL=5
    depends_on:
      - suricata
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Response Handler Service
  response-handler:
    build:
      context: .
      dockerfile: Dockerfile.response
    container_name: ids-response
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - ALERT_FILE=/app/data/processed_alerts.json
    depends_on:
      - alert-monitor
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Web Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ids-dashboard
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    depends_on:
      - alert-monitor
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  suricata_logs:
  monitor_logs:
  dashboard_data:

networks:
  default:
    name: ids-network
